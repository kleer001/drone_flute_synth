<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>belvedere drone</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="banners">
  <div id="disconnected" class="banner bad" hidden>
    Disconnected — the performance may still be running.
  </div>
  <div id="clash" class="banner warn" hidden>
    Another tab submitted.
    <button id="keep-editing" class="link">Keep mine</button>
    <button id="discard" class="link">Reload theirs</button>
  </div>
</div>

<!-- Transport: the master strip, set apart at a fixed end, always live. -->
<div class="transport">
  <button id="runbtn" class="run" title="Start / stop">&#9632;</button>
  <span id="runlamp" class="lamp" title="sounding"></span>
  <span class="live-tag" title="Transport controls apply the moment you move them; they are not part of the Submit set.">live</span>
  <input type="range" id="level" min="0" max="127" step="1"
         title="Master level — applies at once, no Submit">
  <output id="level-out">0</output>
  <button id="panic" class="panic" title="All sound off">panic</button>
  <span class="meta" id="engine-line"></span>
</div>

<main>
  <div class="rows" id="head">
    <div class="field" data-name="root">
      <label for="root">root</label><select id="root"></select>
    </div>
    <div class="field" data-name="mood">
      <label for="mood">mood</label><select id="mood"></select>
    </div>
    <div class="field" data-name="seed">
      <label for="seed">seed</label>
      <input type="text" id="seed" inputmode="numeric">
      <button id="reseed" class="link" title="New random seed">&#8635;</button>
    </div>
  </div>

  <div class="rows" id="weights"></div>
  <div class="rows" id="breath"></div>

  <div id="errors" class="banner bad" hidden></div>

  <div class="commit">
    <button id="submit" class="go" disabled>Submit</button>
    <button id="revert" disabled>Revert</button>
    <span id="status" class="status"></span>
  </div>
</main>

<footer>
  <span id="ro"></span>
  <button id="regenerate" class="link">regenerate ODF</button>
  <span id="regen-note"></span>
  <p>Temperament, voicing and reverb live in GrandOrgue's window — live there,
     invisible here, so anything this page shows about them may be stale.</p>
</footer>

<script src="app.js"></script>
</body>
</html>
