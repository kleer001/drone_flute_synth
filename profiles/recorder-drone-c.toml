# Drone flute in C, just intonation, every melody pipe a true recording.
#
# This profile exists because of what the sample set is. VCSL's baroque
# recorders are sampled whole-tone -- C D E F# G# A#, every step two semitones
# -- with one stray G5. A scale needing semitone steps can only be built by
# transposing recordings, and the A# profile does exactly that for four of its
# six melody notes, dragging each sample's formants a semitone with it.
#
# On C no melody note has to be transposed. C5 -> G5 is the only perfect fifth
# anywhere in the thirteen recordings, and it is the interval a drone
# instrument most needs: every melody note here sounds against a fixed root,
# so a tempered fifth would beat audibly where a just one does not.
#
# The scale is the harmonic series of C, harmonics 8 9 10 11 12 14 16 -- which
# is what these seven recorded pitches spell. The cents table below takes the
# conservative five-limit reading of those degrees rather than the raw
# harmonics, so no interval moves more than 14 cents:
#
#   note   just ratio to the root      cents      12-TET   deviation
#   C5     2/1      octave            1200.00      1200      +0.00
#   D5     9/4      major 9th         1403.91      1400      +3.91
#   E5     5/2      major 10th        1586.31      1600     -13.69
#   F#5    45/16    aug 11th          1790.22      1800      -9.78
#   G5     3/1      twelfth           1901.96      1900      +1.96
#   A#5    32/9     minor 14th        2196.09      2200      -3.91
#   C6     4/1      double octave     2400.00      2400      +0.00
#
# The raw harmonic-series reading is the other defensible choice and is a real
# overtone-flute sound: 11/8 puts F#5 at -48.68 cents and 7/4 puts A#5 at
# -31.17. That is a quartertone-ish F# and it is deliberate on instruments
# built around the natural series. It is not used here, because a ~49 cent
# offset is a different instrument rather than a tuning refinement.
#
# The octave is exactly 2:1. Spike S1 found nothing supporting a stretched
# octave, so none is asserted.

id            = "recorder-drone-c-just"
display       = "Drone flute in C, just intonation, untransposed melody"
family        = "recorder-drone"
concert_a_hz  = 440.0

tuning_origin = "maker-spec"
tuning_source = "Southern Cross Flutes, 'Natural Tuning vs Equal Temperament' (https://www.southerncrossflutes.com/natural-tuning-vs-equal-temperament/) -- states drone flutes are tuned to just intonation on request. The maker page publishes no cents values, so the ratios above are this project's realisation of the tuning the maker names, not a measurement of any instrument."
sample_source = "vcsl-cc0"
sample_note   = "Baroque soprano recorder from VCSL (CC0). A recorder is a duct flute like a drone flute, but it is not one: the structure is right, the timbre is a proxy. Every melody note is a note VCSL actually recorded, so no melody pipe is transposed and no formants are shifted there; across the melody chamber PitchTuning carries only the cents table. The drone is the one exception: C4 is recorded, and C3 is that same recording pitched down 1200 cents, formants and all."

[chambers.drone]
holes = 0
# Two octaves of root, so the drone can sit under a melody that reaches down
# into the C4 octave. C4 is recorded; C3 is that recording pitched down an
# octave by GrandOrgue, which is the one borrowed pipe in this file.
#
# C2 is not offered and cannot be. GrandOrgue accepts PitchTuning only within
# +/-1800 cents -- measured against 3.17.3, which loads -1800 and rejects
# -1801 with "Out of range value at section 'Rank001' entry
# 'Pipe001PitchTuning'". A second octave down needs -2400. The only route to
# one is a pre-rendered half-speed sample, and two octaves below a soprano
# recorder is a slowed tape rather than a low flute.
notes = ["C4", "C3"]
samples = { "C3" = "C4" }

[chambers.melody]
holes = 6
# The upper octave is harmonics 8 9 10 11 12 14 16 of C -- and, not by
# coincidence, seven of the thirteen pitches VCSL recorded.
#
# The octave below it is the same degrees again, minus two that cannot be had
# honestly:
#
#   G4  VCSL never recorded it. It is the lower octave's perfect fifth, and
#       the only sources for it are G#4 down a semitone or G5 down an octave.
#       Both are transposed pipes, and this chamber borrows nothing, so the
#       fifth is simply absent down there.
#   C4  recorded, but its loop does not pass tools/loop_qa.py -- CV 0.0203
#       against a 0.02 threshold, the one failure left in the set. The drone
#       chamber uses C4 knowingly; the melody does not, so the walk's bottom
#       note is D4.
#
# The walk therefore has eleven pitches with an uneven lower octave, which is
# what an instrument with these holes and these recordings actually offers.
notes = ["D4", "E4", "F#4", "A#4", "C5", "D5", "E5", "F#5", "G5", "A#5", "C6"]
# Deviation from 12-TET, in cents. THE primary artifact of this file.
# Just ratios are octave-invariant, so each pitch class repeats its deviation.
cents = { "D4" = 3.91, "E4" = -13.69, "F#4" = -9.78, "A#4" = -3.91, "C5" = 0.0, "D5" = 3.91, "E5" = -13.69, "F#5" = -9.78, "G5" = 1.96, "A#5" = -3.91, "C6" = 0.0 }
# No pitch-fill: every note above is recorded, so nothing borrows.
samples = {}

[meter]
# The instrument's clock. A breath resolves to a bar line: the phrase sounds
# for whole beats, the player breathes on the last of them, and the next phrase
# starts on a downbeat -- which is how a wind player actually phrases.
#
# 84 bpm puts the eighth note at 357 ms, the subdivision a flute line can be
# read at without the ear losing the beat.
bpm = 84
beats_per_measure = 4

[breath]
mean_s = 7.0
spread_s = 2.5
inhale_s = 0.7

[odf]
path = "recorder-drone-c.organ"
sample_dir = "samples"
