# NAF-style double drone flute, key of A#/Bb.
#
# The cents table is a JUST minor pentatonic, not a measured Native American
# flute scale. Spike S1 went looking for the measured scale and did not find
# one: see RESEARCH.md §7. Just intonation is used because it is the one
# non-equal tuning for a drone flute that a maker states on the record, and
# because a drone instrument has an acoustic reason to want it -- every melody
# note is sounding against a fixed root, so beat-free intervals are audible in
# a way they are not on a melody-only instrument.
#
# Deviations below are cents from 12-TET for each interval above the root:
#   minor third  6/5  = 315.64  ->  +15.64
#   fourth       4/3  = 498.04  ->   -1.96
#   fifth        3/2  = 701.96  ->   +1.96
#   minor 7th    9/5  = 1017.60 ->  +17.60
#   octave       2/1  = 1200.00 ->    0.00
#
# The octave is exactly 2:1. Nothing found in S1 supports a stretched octave,
# so none is asserted here.

id            = "naf-double-drone-as-just"
display       = "NAF-style double drone flute in A#, just minor pentatonic"
family        = "naf-double"
concert_a_hz  = 440.0

tuning_origin = "maker-spec"
tuning_source = "Southern Cross Flutes, 'Natural Tuning vs Equal Temperament' (https://www.southerncrossflutes.com/natural-tuning-vs-equal-temperament/) -- states drone flutes are tuned to just intonation on request. Ratios are the standard just minor pentatonic; the maker page does not publish cents values, so the ratios are this project's realisation of the tuning the maker names."
sample_source = "vcsl-cc0"
sample_note   = "Baroque soprano recorder from VCSL (CC0), looped and retuned per pipe. A recorder is a duct flute like the NAF, but it is not a NAF: the structure and intonation are right, the timbre is a proxy. VCSL samples this instrument whole-tone, so semitone scale degrees borrow the nearest recording and are shifted by up to 100 cents."

[chambers.drone]
holes = 0
notes = ["A#4"]

[chambers.melody]
holes = 6
# Minor pentatonic on A#: root, m3, 4, 5, m7, octave.
notes = ["A#4", "C#5", "D#5", "F5", "G#5", "A#5"]
# Deviation from 12-TET, in cents. THE primary artifact of this file.
cents = { "A#4" = 0.0, "C#5" = 15.64, "D#5" = -1.96, "F5" = 1.96, "G#5" = 17.6, "A#5" = 0.0 }
# Pitch-fill: which recorded note supplies each scale degree. VCSL's soprano
# recorder covers A#4 C4 C5 C6 D4 D5 E4 E5 F#4 F#5 G#4 G5 A#5 only.
samples = { "C#5" = "C5", "D#5" = "D5", "F5" = "F#5", "G#5" = "G5" }

[breath]
mean_s = 7.0
spread_s = 2.5
inhale_s = 0.7

[odf]
path = "naf-double-drone-as.organ"
sample_dir = "samples"
